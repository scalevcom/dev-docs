<script>
(() => {
  const statusUrl = "https://status.scalev.com";

  const updateStatusLinks = () => {
    document.querySelectorAll('a[href="/page/status"]').forEach((link) => {
      link.href = statusUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.removeAttribute("to");
    });
  };

  updateStatusLinks();
  new MutationObserver(updateStatusLinks).observe(document.documentElement, {
    childList: true,
    subtree: true,
  });

  document.addEventListener(
    "click",
    (event) => {
      const link = event.target.closest(
        `a[href="/page/status"], a[href="${statusUrl}"]`
      );
      if (!link) return;

      event.preventDefault();
      event.stopImmediatePropagation();
      window.open(statusUrl, "_blank", "noopener,noreferrer");
    },
    true
  );
})();
</script>
